name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks on ${{ matrix.os }} (Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm pack --dry-run

  integration:
    name: Real R languageserver and Lumine integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LUMINE_JASMINE_REPORTER: list
      LUMINE_TEST_PACKAGES: ide-client language-r
      R_LSP_VERSION: 0.3.20
      REQUIRE_R_LSP: 1
      REQUIRE_R_MANAGED_INSTALL: 1
    steps:
      - uses: actions/checkout@v7
        with:
          path: ide-r
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/lumine
          path: lumine
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/ide-client
          path: ide-client
      - uses: actions/checkout@v7
        with:
          repository: lumine-code/language-r
          path: language-r
      - uses: actions/setup-node@v7
        with:
          node-version-file: lumine/.nvmrc
          cache: npm
          cache-dependency-path: lumine/package-lock.json
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install -y xvfb libx11-dev libxkbfile-dev libsecret-1-dev libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev
      - name: Install exact R languageserver and verify its version
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages("remotes")
          remotes::install_version("languageserver", version = Sys.getenv("R_LSP_VERSION"), upgrade = "never")
          stopifnot(as.character(packageVersion("languageserver")) == Sys.getenv("R_LSP_VERSION"))
      - name: Use HTTPS for public Git dependencies
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install adapter dependencies
        working-directory: ide-r
        run: npm ci --ignore-scripts
      - name: Install client dependencies
        working-directory: ide-client
        run: npm ci --ignore-scripts
      - name: Install editor dependencies
        working-directory: lumine
        run: |
          install() { npm ci --ignore-scripts; }
          install || install || install
      - name: Prepare Electron
        working-directory: lumine
        run: |
          node node_modules/electron/install.js
          npm run build
      - name: Provision isolated integration dependencies
        run: |
          echo "LUMINE_HOME=$GITHUB_WORKSPACE/.test-home" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.test-home/packages"
          ln -s "$GITHUB_WORKSPACE/ide-client" "$GITHUB_WORKSPACE/.test-home/packages/ide-client"
          ln -s "$GITHUB_WORKSPACE/language-r" "$GITHUB_WORKSPACE/.test-home/packages/language-r"
      - name: Run Jasmine specs against the real editor and server
        working-directory: lumine
        timeout-minutes: 20
        run: xvfb-run --auto-servernum npm start -- --test ../ide-r/spec
